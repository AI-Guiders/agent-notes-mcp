# Build win-x64 and publish to Generic Package on tag v*
# Then add asset link to the release (release created via API).

stages:
  - build
  - release

variables:
  PACKAGE_NAME: agent-notes-mcp
  ZIP_NAME: agent-notes-mcp-win-x64.zip

build-win-x64:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script:
    - apt-get update -qq && apt-get install -y -qq zip
  script:
    - dotnet publish -c Release -o out
    - cd out && zip -r ../${ZIP_NAME} . && cd ..
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ${ZIP_NAME} \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${ZIP_NAME}"
  artifacts:
    paths:
      - ${ZIP_NAME}

add-release-asset:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - build-win-x64
  image: curlimages/curl:latest
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - ASSET_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${ZIP_NAME}"
    - |
      curl --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
        --data "{\"name\":\"${ZIP_NAME}\",\"url\":\"${ASSET_URL}\",\"link_type\":\"package\"}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
  when: on_success
